<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opening Checkout...</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <script>
    (function() {
      var p = new URLSearchParams(window.location.search);
      var plan = p.get('plan') || '12m';
      window.location.replace("./?modal=order&plan=" + encodeURIComponent(plan));
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./?modal=order&plan=12m">
</head>
<body style="background:#05070a;color:#94a3b8;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Connecting to checkout... <a href="./?modal=order&plan=12m" style="color:#6366f1;">Click here if not redirected</a></p>
</body>
</html>
